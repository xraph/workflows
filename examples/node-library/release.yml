name: Release

# Push a vX.Y.Z tag and every package below goes to npm at X.Y.Z, after CI
# passes on the tagged commit. Dispatch it by hand to rehearse: dry-run is on
# unless you switch it off.

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      dry-run:
        type: boolean
        default: true
      version:
        description: 'Version to stamp, without a leading v. Empty keeps each package.json version.'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  ci:
    uses: xraph/workflows/.github/workflows/node-ci.yml@v1

  # The expression language has no string replace, and npm-publish.yml refuses
  # a version with a leading v, so the tag is trimmed here.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      dry-run: ${{ steps.resolve.outputs.dry_run }}
    steps:
      - id: resolve
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_DRY_RUN: ${{ inputs.dry-run }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = push ]; then
            echo "version=${REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "version=${INPUT_VERSION#v}" >> "$GITHUB_OUTPUT"
            echo "dry_run=${INPUT_DRY_RUN:-true}" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: [ci, prepare]
    uses: xraph/workflows/.github/workflows/npm-publish.yml@v1
    with:
      package-manager: pnpm
      # Dependencies first. Internal peer ranges should be `workspace:^` so they
      # pack as a caret range on this release.
      packages: '["packages/core","packages/react"]'
      version: ${{ needs.prepare.outputs.version }}
      dry-run: ${{ needs.prepare.outputs.dry-run == 'true' }}
      build-script: build
      skip-existing: true
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
