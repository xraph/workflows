name: Go CI

on:
  workflow_call:
    inputs:
      go-versions:
        description: 'JSON array of Go versions for the test matrix'
        type: string
        default: '["1.24","1.25"]'
      primary-go-version:
        description: 'Go version used for lint, coverage and security. Empty means the last entry of go-versions.'
        type: string
        default: ''
      os:
        description: 'JSON array of runner labels for the test matrix'
        type: string
        default: '["ubuntu-latest","macos-latest","windows-latest"]'
      working-directory:
        description: 'Directory containing go.mod'
        type: string
        default: '.'
      golangci-lint-version:
        type: string
        default: 'v2.12.2'
      golangci-lint-timeout:
        description: 'Timeout passed to golangci-lint. Raise it for a large module or one with a cold build cache - setup-go only caches the module cache, not the build cache, so a big repo can typecheck every package and dependency from scratch within this window.'
        type: string
        default: '5m'
      gosec-version:
        type: string
        default: 'v2.28.0'
      govulncheck-version:
        type: string
        default: 'v1.6.0'
      coverage:
        description: 'Produce and upload a coverage report from the primary combination'
        type: boolean
        default: true
      codecov-flag-name:
        description: 'Codecov flag name. Empty means <repo-name>-coverage.'
        type: string
        default: ''
      skip-security:
        type: boolean
        default: false
      node-version:
        description: 'Set up Node at this version before running tests. Empty means no Node. Needed by Go projects whose tests shell out to a JS toolchain.'
        type: string
        default: ''
      npm-global-packages:
        description: 'Space-separated npm specs to install globally, e.g. "typescript@5.8.2 esbuild@0.28.1". Requires node-version.'
        type: string
        default: ''
      prefer-makefile:
        description: 'Use a Makefile target when one matching the step exists. Set false to force the plain go commands - a repo whose make targets do something broader than CI wants (e.g. sweeping every module) needs this.'
        type: boolean
        default: true
      only-test:
        description: 'Run only the test matrix, skipping lint, verify and security. Lets a caller split gating from non-gating across two calls.'
        type: boolean
        default: false
      govulncheck-fail-on-findings:
        description: 'Fail the build on govulncheck findings. Set false when a reachable advisory has no published fix - otherwise CI blocks indefinitely on something nobody can act on. Findings are always reported.'
        type: boolean
        default: true
      gosec-fail-on-findings:
        description: 'Fail the build on gosec findings. SARIF is uploaded either way.'
        type: boolean
        default: true
      check-nested-modules:
        description: 'Check that nested go.mod files require their siblings at versions the module proxy can serve. A nested module replace is ignored once the module is somebody else dependency, so a require naming an unpublished version breaks go get for every consumer while every local build keeps working. No-op in a repo with a single go.mod.'
        type: boolean
        default: true
      goprivate:
        description: 'GOPRIVATE glob applied when XRAPH_REPO_TOKEN is set. Narrow it to what is genuinely private - the glob also sets GONOPROXY, so a broad one drags every public module under it off the proxy and onto a full git clone per job, for nothing. Comma-separated for more than one.'
        type: string
        default: 'github.com/xraph/*'
    secrets:
      CODECOV_TOKEN:
        required: false
      XRAPH_REPO_TOKEN:
        description: 'Read access to the private repositories in this org. Without it, private modules are never fetched and a repo that needs one fails at download.'
        required: false

jobs:
  setup:
    name: Resolve config
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      primary-go-version: ${{ steps.resolve.outputs.primary }}
      codecov-flag: ${{ steps.resolve.outputs.flag }}
    steps:
      - name: Resolve primary Go version and Codecov flag
        id: resolve
        shell: bash
        env:
          PRIMARY_IN: ${{ inputs.primary-go-version }}
          VERSIONS_IN: ${{ inputs.go-versions }}
          FLAG_IN: ${{ inputs.codecov-flag-name }}
          REPO_NAME: ${{ github.event.repository.name }}
          WORKING_DIR: ${{ inputs.working-directory }}
        run: |
          set -euo pipefail
          if [ -n "$PRIMARY_IN" ]; then
            PRIMARY="$PRIMARY_IN"
          else
            PRIMARY=$(printf '%s' "$VERSIONS_IN" | jq -r '.[-1]')
          fi
          FLAG="$FLAG_IN"
          if [ -z "$FLAG" ]; then
            FLAG="${REPO_NAME}-coverage"
          fi
          echo "primary=$PRIMARY" >> "$GITHUB_OUTPUT"
          echo "flag=$FLAG" >> "$GITHUB_OUTPUT"
          {
            echo "### CI configuration"
            echo "- primary Go version: \`$PRIMARY\`"
            echo "- Codecov flag: \`$FLAG\`"
            echo "- working directory: \`$WORKING_DIR\`"
          } >> "$GITHUB_STEP_SUMMARY"

  test:
    name: Test (${{ matrix.os }}, go${{ matrix.go-version }})
    needs: setup
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os) }}
        go-version: ${{ fromJSON(inputs.go-versions) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # kgkit and any other private xraph module is not on the public proxy, and
      # an unauthenticated fetch comes back "repository not found", which reads
      # as a missing repo rather than a missing credential. Carry the token on
      # the org's clone URL and take the private paths off the proxy.
      #
      # The rewrite is scoped to the org rather than to all of github.com, so it
      # cannot clobber a credential a consumer has already set for somewhere
      # else. No-op without the secret, so public-only consumers are unaffected.
      - name: Configure Go module auth
        shell: bash
        env:
          XRAPH_REPO_TOKEN: ${{ secrets.XRAPH_REPO_TOKEN }}
          GOPRIVATE_GLOB: ${{ inputs.goprivate }}
        run: |
          set -euo pipefail
          if [ -n "${XRAPH_REPO_TOKEN:-}" ]; then
            git config --global url."https://x-access-token:${XRAPH_REPO_TOKEN}@github.com/xraph/".insteadOf "https://github.com/xraph/"
            echo "GOPRIVATE=${GOPRIVATE_GLOB}" >> "$GITHUB_ENV"
            echo "- private modules: \`${GOPRIVATE_GLOB}\`, fetched over the token" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
          # Resolve a bare minor (e.g. "1.26") to the newest patch instead of whatever
          # the runner toolcache happens to hold, which otherwise pins security scans to
          # a stale, vulnerable Go.
          check-latest: true
          cache-dependency-path: ${{ inputs.working-directory }}/go.mod

      - name: Set up Node.js
        if: inputs.node-version != ''
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}

      - name: Install global npm packages
        if: inputs.node-version != '' && inputs.npm-global-packages != ''
        env:
          NPM_PACKAGES: ${{ inputs.npm-global-packages }}
        run: |
          set -euo pipefail
          # npm specs never contain spaces; word splitting is intended.
          # shellcheck disable=SC2086
          npm install -g -- $NPM_PACKAGES

      - name: Download dependencies
        run: go mod download

      - name: Resolve test command
        id: cmd
        env:
          PREFER_MAKEFILE: ${{ inputs.prefer-makefile }}
        run: |
          set -euo pipefail
          if [ "$PREFER_MAKEFILE" = 'true' ] && [ -f Makefile ] && make -n test >/dev/null 2>&1; then
            echo 'run=make test' >> "$GITHUB_OUTPUT"
            # shellcheck disable=SC2016 # backticks are literal markdown formatting, not command substitution
            echo 'source=Makefile target `test`' >> "$GITHUB_OUTPUT"
          else
            echo 'run=go test -race ./...' >> "$GITHUB_OUTPUT"
            # shellcheck disable=SC2016 # backticks are literal markdown formatting, not command substitution
            echo 'source=fallback `go test -race ./...`' >> "$GITHUB_OUTPUT"
          fi

      - name: Report resolved test command
        env:
          MATRIX_OS: ${{ matrix.os }}
          MATRIX_GO_VERSION: ${{ matrix.go-version }}
          CMD_SOURCE: ${{ steps.cmd.outputs.source }}
        run: |
          echo "- \`$MATRIX_OS\` go$MATRIX_GO_VERSION tests: $CMD_SOURCE" >> "$GITHUB_STEP_SUMMARY"

      - name: Run tests
        env:
          TEST_CMD: ${{ steps.cmd.outputs.run }}
        run: |
          set -euo pipefail
          eval "$TEST_CMD"

      - name: Resolve coverage command
        id: covcmd
        if: inputs.coverage && matrix.os == 'ubuntu-latest' && matrix.go-version == needs.setup.outputs.primary-go-version
        env:
          PREFER_MAKEFILE: ${{ inputs.prefer-makefile }}
        run: |
          set -euo pipefail
          if [ "$PREFER_MAKEFILE" = 'true' ] && [ -f Makefile ] && make -n test-coverage >/dev/null 2>&1; then
            echo 'run=make test-coverage' >> "$GITHUB_OUTPUT"
            # shellcheck disable=SC2016 # backticks are literal markdown formatting, not command substitution
            echo 'source=Makefile target `test-coverage`' >> "$GITHUB_OUTPUT"
          else
            echo 'run=go test -race -covermode=atomic -coverprofile=coverage.out ./...' >> "$GITHUB_OUTPUT"
            # shellcheck disable=SC2016 # backticks are literal markdown formatting, not command substitution
            echo 'source=fallback `go test -coverprofile`' >> "$GITHUB_OUTPUT"
          fi

      - name: Run coverage
        if: steps.covcmd.outcome == 'success'
        env:
          COV_SOURCE: ${{ steps.covcmd.outputs.source }}
          COV_CMD: ${{ steps.covcmd.outputs.run }}
        run: |
          set -euo pipefail
          echo "- coverage: $COV_SOURCE" >> "$GITHUB_STEP_SUMMARY"
          eval "$COV_CMD"

      - name: Locate coverage profile
        id: covfile
        if: steps.covcmd.outcome == 'success'
        env:
          WORKING_DIR: ${{ inputs.working-directory }}
        run: |
          set -euo pipefail
          if [ -f coverage.out ]; then
            echo "path=$WORKING_DIR/coverage.out" >> "$GITHUB_OUTPUT"
          elif [ -f coverage/coverage.out ]; then
            echo "path=$WORKING_DIR/coverage/coverage.out" >> "$GITHUB_OUTPUT"
          else
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "No coverage profile produced; skipping upload." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Check for Codecov token
        id: codecov
        if: steps.covfile.outputs.path != ''
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${CODECOV_TOKEN:-}" ]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
            echo "CODECOV_TOKEN not set; skipping coverage upload." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage to Codecov
        if: steps.codecov.outputs.present == 'true'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ steps.covfile.outputs.path }}
          flags: ${{ needs.setup.outputs.codecov-flag }}
          name: unittests
          fail_ci_if_error: false

  lint:
    name: Lint
    if: ${{ !inputs.only-test }}
    needs: setup
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # kgkit and any other private xraph module is not on the public proxy, and
      # an unauthenticated fetch comes back "repository not found", which reads
      # as a missing repo rather than a missing credential. Carry the token on
      # the org's clone URL and take the private paths off the proxy.
      #
      # The rewrite is scoped to the org rather than to all of github.com, so it
      # cannot clobber a credential a consumer has already set for somewhere
      # else. No-op without the secret, so public-only consumers are unaffected.
      - name: Configure Go module auth
        shell: bash
        env:
          XRAPH_REPO_TOKEN: ${{ secrets.XRAPH_REPO_TOKEN }}
          GOPRIVATE_GLOB: ${{ inputs.goprivate }}
        run: |
          set -euo pipefail
          if [ -n "${XRAPH_REPO_TOKEN:-}" ]; then
            git config --global url."https://x-access-token:${XRAPH_REPO_TOKEN}@github.com/xraph/".insteadOf "https://github.com/xraph/"
            echo "GOPRIVATE=${GOPRIVATE_GLOB}" >> "$GITHUB_ENV"
            echo "- private modules: \`${GOPRIVATE_GLOB}\`, fetched over the token" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ needs.setup.outputs.primary-go-version }}
          # Resolve a bare minor (e.g. "1.26") to the newest patch instead of whatever
          # the runner toolcache happens to hold, which otherwise pins security scans to
          # a stale, vulnerable Go.
          check-latest: true
          cache-dependency-path: ${{ inputs.working-directory }}/go.mod

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ inputs.golangci-lint-version }}
          working-directory: ${{ inputs.working-directory }}
          args: --timeout=${{ inputs.golangci-lint-timeout }}

  verify:
    name: Verify
    if: ${{ !inputs.only-test }}
    needs: setup
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # kgkit and any other private xraph module is not on the public proxy, and
      # an unauthenticated fetch comes back "repository not found", which reads
      # as a missing repo rather than a missing credential. Carry the token on
      # the org's clone URL and take the private paths off the proxy.
      #
      # The rewrite is scoped to the org rather than to all of github.com, so it
      # cannot clobber a credential a consumer has already set for somewhere
      # else. No-op without the secret, so public-only consumers are unaffected.
      - name: Configure Go module auth
        shell: bash
        env:
          XRAPH_REPO_TOKEN: ${{ secrets.XRAPH_REPO_TOKEN }}
          GOPRIVATE_GLOB: ${{ inputs.goprivate }}
        run: |
          set -euo pipefail
          if [ -n "${XRAPH_REPO_TOKEN:-}" ]; then
            git config --global url."https://x-access-token:${XRAPH_REPO_TOKEN}@github.com/xraph/".insteadOf "https://github.com/xraph/"
            echo "GOPRIVATE=${GOPRIVATE_GLOB}" >> "$GITHUB_ENV"
            echo "- private modules: \`${GOPRIVATE_GLOB}\`, fetched over the token" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ needs.setup.outputs.primary-go-version }}
          # Resolve a bare minor (e.g. "1.26") to the newest patch instead of whatever
          # the runner toolcache happens to hold, which otherwise pins security scans to
          # a stale, vulnerable Go.
          check-latest: true
          cache-dependency-path: ${{ inputs.working-directory }}/go.mod

      - name: Check formatting
        run: |
          set -euo pipefail
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "These files are not gofmt-clean:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Resolve vet command
        id: vetcmd
        env:
          PREFER_MAKEFILE: ${{ inputs.prefer-makefile }}
        run: |
          set -euo pipefail
          if [ "$PREFER_MAKEFILE" = 'true' ] && [ -f Makefile ] && make -n vet >/dev/null 2>&1; then
            echo 'run=make vet' >> "$GITHUB_OUTPUT"
            # shellcheck disable=SC2016 # backticks are literal markdown formatting, not command substitution
            echo 'source=Makefile target `vet`' >> "$GITHUB_OUTPUT"
          else
            echo 'run=go vet ./...' >> "$GITHUB_OUTPUT"
            # shellcheck disable=SC2016 # backticks are literal markdown formatting, not command substitution
            echo 'source=fallback `go vet ./...`' >> "$GITHUB_OUTPUT"
          fi

      - name: Run vet
        env:
          VET_SOURCE: ${{ steps.vetcmd.outputs.source }}
          VET_CMD: ${{ steps.vetcmd.outputs.run }}
        run: |
          set -euo pipefail
          echo "- vet: $VET_SOURCE" >> "$GITHUB_STEP_SUMMARY"
          eval "$VET_CMD"

      - name: Check go.mod tidiness
        run: |
          set -euo pipefail
          go mod tidy
          git diff --exit-code -- go.mod go.sum

  security:
    name: Security
    needs: setup
    if: ${{ !inputs.skip-security && !inputs.only-test }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # kgkit and any other private xraph module is not on the public proxy, and
      # an unauthenticated fetch comes back "repository not found", which reads
      # as a missing repo rather than a missing credential. Carry the token on
      # the org's clone URL and take the private paths off the proxy.
      #
      # The rewrite is scoped to the org rather than to all of github.com, so it
      # cannot clobber a credential a consumer has already set for somewhere
      # else. No-op without the secret, so public-only consumers are unaffected.
      - name: Configure Go module auth
        shell: bash
        env:
          XRAPH_REPO_TOKEN: ${{ secrets.XRAPH_REPO_TOKEN }}
          GOPRIVATE_GLOB: ${{ inputs.goprivate }}
        run: |
          set -euo pipefail
          if [ -n "${XRAPH_REPO_TOKEN:-}" ]; then
            git config --global url."https://x-access-token:${XRAPH_REPO_TOKEN}@github.com/xraph/".insteadOf "https://github.com/xraph/"
            echo "GOPRIVATE=${GOPRIVATE_GLOB}" >> "$GITHUB_ENV"
            echo "- private modules: \`${GOPRIVATE_GLOB}\`, fetched over the token" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ needs.setup.outputs.primary-go-version }}
          # Resolve a bare minor (e.g. "1.26") to the newest patch instead of whatever
          # the runner toolcache happens to hold, which otherwise pins security scans to
          # a stale, vulnerable Go.
          check-latest: true
          cache-dependency-path: ${{ inputs.working-directory }}/go.mod

      - name: Run gosec
        shell: bash
        env:
          GOSEC_VERSION: ${{ inputs.gosec-version }}
        run: |
          set -euo pipefail
          go install "github.com/securego/gosec/v2/cmd/gosec@${GOSEC_VERSION}"
          gosec -no-fail -fmt sarif -out gosec.sarif -exclude=G115 -exclude-dir=vendor -exclude-generated ./...

      - name: Determine whether SARIF can be uploaded
        id: sarif
        shell: bash
        env:
          IS_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork }}
        run: |
          set -euo pipefail
          if [ "$IS_FORK" = 'true' ]; then
            echo 'upload=false' >> "$GITHUB_OUTPUT"
            echo "Fork pull request: no write token, so SARIF upload is skipped." >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'upload=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Upload gosec SARIF
        if: steps.sarif.outputs.upload == 'true'
        # Best-effort. Code scanning ingest needs GitHub Advanced Security on a
        # private repository; without it this returns 403 and there is nothing
        # the consumer can do about it from a workflow. Failing here would gate
        # merges on a billing setting rather than on the code, and the findings
        # are not lost: the next step reports them in the run summary and fails
        # the job when gosec-fail-on-findings is set.
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ inputs.working-directory }}/gosec.sarif
          category: gosec

      - name: Report gosec findings
        shell: bash
        env:
          FAIL_ON_FINDINGS: ${{ inputs.gosec-fail-on-findings }}
        run: |
          set -euo pipefail
          COUNT=$(jq '[.runs[]?.results[]?] | length' gosec.sarif)
          echo "- gosec findings: **${COUNT}**" >> "$GITHUB_STEP_SUMMARY"
          if [ "$COUNT" -gt 0 ]; then
            jq -r '.runs[].results[] | "\(.ruleId): \(.message.text)"' gosec.sarif
            if [ "$FAIL_ON_FINDINGS" = 'true' ]; then
              echo "Failing because gosec-fail-on-findings is true."
              exit 1
            fi
            echo "gosec-fail-on-findings is false; reporting only."
          fi

      - name: Run govulncheck
        env:
          GOVULNCHECK_VERSION: ${{ inputs.govulncheck-version }}
          FAIL_ON_FINDINGS: ${{ inputs.govulncheck-fail-on-findings }}
        run: |
          set -euo pipefail
          go install "golang.org/x/vuln/cmd/govulncheck@$GOVULNCHECK_VERSION"
          # Always report; decide separately whether findings block the build.
          if govulncheck ./... 2>&1 | tee govulncheck.log; then
            echo "- govulncheck: no reachable vulnerabilities" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          COUNT=$(grep -c '^Vulnerability #' govulncheck.log || true)
          echo "- govulncheck: **${COUNT}** reachable vulnerabilities" >> "$GITHUB_STEP_SUMMARY"
          if [ "$FAIL_ON_FINDINGS" = 'true' ]; then
            echo "Failing because govulncheck-fail-on-findings is true."
            exit 1
          fi
          echo "govulncheck-fail-on-findings is false; reporting only."

  nested-modules:
    name: Nested modules
    runs-on: ubuntu-latest
    if: inputs.check-nested-modules
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ inputs.primary-go-version || '1.25' }}
          cache: false

      - name: Check intra-repo requires resolve
        shell: bash
        run: |
          # Check that every intra-repo require in a nested module names a version a
          # consumer can actually resolve.
          #
          # A nested module carries a replace so the working tree builds against
          # itself. That replace is ignored the moment the module becomes somebody
          # else's dependency, so the require line is what a consumer resolves. If it
          # names a version that was never published, `go get` on that nested module
          # fails outright, and no ordinary build notices because the replace hides it.
          #
          #   default mode  fails on v0.0.0 and on anything that is not valid semver.
          #                 A version that simply is not published yet is reported and
          #                 tolerated, because release rewrites these before tagging.
          #   --strict      additionally requires every version to be live on the
          #                 proxy. Run this after tagging, when it must all be true.
          set -uo pipefail

          STRICT=0
          [ "${1:-}" = "--strict" ] && { STRICT=1; shift; }
          cd "${1:-.}"

          ROOT=$(awk '/^module /{print $2; exit}' go.mod 2>/dev/null || true)
          if [ -z "$ROOT" ]; then
          	echo "no root go.mod, nothing to check"
          	exit 0
          fi

          # The proxy encodes an uppercase letter as !x. xraph paths are lowercase but
          # the encoding is part of the protocol, so do it properly.
          escape() { printf '%s' "$1" | sed -E 's/([A-Z])/!\L\1/g'; }

          fail=0
          checked=0
          pending=0
          # Portable memo of proxy answers. An associative array would be neater but
          # needs bash 4, and on bash 3.2 it fails in a way that silently undercounts
          # instead of erroring, which is worse than being a little verbose here.
          seen_ok=""
          seen_missing=""
          while IFS= read -r f; do
          	[ "$f" = "./go.mod" ] && continue
          	dir=${f%/go.mod}; dir=${dir#./}
          	while read -r path ver; do
          		[ -z "$path" ] && continue
          		checked=$((checked + 1))

          		# v0.0.0 and the zero pseudo-version are the two shapes Go leaves
          		# behind when a module is only ever reached through a replace. The
          		# second is valid semver, which is exactly why it slips past a
          		# format check, and it resolves for nobody.
          		if [ "$ver" = "v0.0.0" ] || [ "$ver" = "v0.0.0-00010101000000-000000000000" ]; then
          			echo "::error file=${f#./}::$path is required at $ver, which is not a version anyone can fetch. Someone running 'go get $path' gets 'unknown revision v0.0.0'. It works for you only because you already require $ROOT at a real version. Name a released version here; the replace directive keeps local builds on the working tree."
          			fail=1
          			continue
          		fi
          		if ! printf '%s' "$ver" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
          			echo "::error file=${f#./}::$path is required at '$ver', which is not a semver version."
          			fail=1
          			continue
          		fi

          		# Most nested modules in a repo require the same root version, so
          		# ask the proxy once per distinct pair rather than once per module.
          		key="${path}@${ver}"
          		case "$seen_ok" in
          		*"|${key}|"*) continue ;;
          		esac
          		case "$seen_missing" in
          		*"|${key}|"*) ;;
          		*)
          			if curl -sSfL --max-time 20 "https://proxy.golang.org/$(escape "$path")/@v/${ver}.info" > /dev/null 2>&1; then
          				seen_ok="${seen_ok}|${key}|"
          				continue
          			fi
          			seen_missing="${seen_missing}|${key}|"
          			;;
          		esac
          		if [ "$STRICT" -eq 1 ]; then
          			echo "::error file=${f#./}::$path@$ver is not on the module proxy, so nobody can consume $dir."
          			fail=1
          		else
          			echo "::notice file=${f#./}::$path@$ver is not published yet. Fine before a first release, since release pins these to the tag it cuts, but it has to be real by then."
          			pending=$((pending + 1))
          		fi
          	done < <(go mod edit -json "$f" 2>/dev/null | jq -r --arg r "$ROOT" '.Require[]? | select(.Path == $r or (.Path | startswith($r + "/"))) | "\(.Path) \(.Version)"')
          done < <(find . -name go.mod -not -path './.git/*' -not -path '*/node_modules/*' -not -path './.claude/*' -not -path '*/testdata/*' -not -path '*/vendor/*' -not -path '*/_*' | sort)

          if [ "$checked" -eq 0 ]; then
          	echo "no nested module requires anything from this repo, nothing to check"
          elif [ "$fail" -eq 0 ]; then
          	echo "checked $checked intra-repo require(s), all resolvable ($pending not published yet)"
          fi
          exit "$fail"
