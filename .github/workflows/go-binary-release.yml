name: Go Binary Release

on:
  workflow_call:
    inputs:
      go-version:
        type: string
        default: '1.25'
      go-version-file:
        description: 'Read the Go version from this file instead of go-version. Avoids duplicating the version in two places.'
        type: string
        default: ''
      docker:
        description: 'Set up QEMU, Buildx and a registry login. Required for a .goreleaser.yml with dockers/docker_manifests, which cannot cross-build without QEMU.'
        type: boolean
        default: false
      registry:
        description: 'Container registry to log into when docker is true.'
        type: string
        default: 'ghcr.io'
      goreleaser-version:
        type: string
        default: 'v2.17.1'
      goreleaser-args:
        type: string
        default: 'release --clean'
      working-directory:
        type: string
        default: '.'
      ref:
        description: 'Ref to check out, usually a release tag. Empty means the ref that started the run. Set it when a manual run re-publishes a tag that already exists, so GoReleaser finds the tag at HEAD.'
        type: string
        default: ''
      node-version:
        description: 'Set up this Node version before GoReleaser runs. Empty skips Node. Needed when a before hook builds a frontend that ships inside an archive.'
        type: string
        default: ''
      pnpm-directory:
        description: 'Directory, from the repository root, holding a package.json whose "packageManager" field names a pnpm version. Set it to install that pnpm and cache its store. Needs node-version.'
        type: string
        default: ''
    secrets:
      HOMEBREW_TAP_TOKEN:
        required: false
      SCOOP_BUCKET_TOKEN:
        required: false
      GPG_PRIVATE_KEY:
        required: false
      GORELEASER_TOKEN:
        description: 'Preferred over GITHUB_TOKEN when GoReleaser pushes to other repos (a Homebrew tap, a Scoop bucket). Falls back to GITHUB_TOKEN.'
        required: false
      FURY_TOKEN:
        description: 'Gemfury, for nfpms deb/rpm publishing.'
        required: false
      AUR_KEY:
        description: 'Arch User Repository SSH key.'
        required: false

jobs:
  goreleaser:
    name: GoReleaser
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Required whenever `docker: true`: the login below authenticates to the
      # registry as GITHUB_TOKEN, and pushing to ghcr.io needs package write.
      #
      # This block is the authoritative one for this job -- a caller's
      # `permissions:` cannot widen what a reusable workflow declares -- and once
      # any block exists, everything unlisted is `none`. So callers that did
      # declare `packages: write` themselves still got `packages: none` here, and
      # the push failed after a full build with
      #
      #   denied: installation not allowed to Write organization package
      #
      # which reads like a registry ACL problem and is not one: the token has no
      # packages scope to exercise. Granting the repository write access on the
      # package does not change it.
      #
      # Harmless when `docker` is false -- nothing authenticates to a registry
      # on that path, so the scope goes unused.
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Check the Node inputs
        if: inputs.pnpm-directory != '' && inputs.node-version == ''
        shell: bash
        run: |
          echo "::error::pnpm-directory needs node-version: pnpm cannot run without Node."
          exit 1

      # pnpm goes on the PATH first so setup-node can cache its store.
      - name: Set up pnpm
        if: inputs.pnpm-directory != ''
        uses: pnpm/action-setup@v4
        with:
          package_json_file: ${{ inputs.pnpm-directory }}/package.json

      - name: Set up Node
        if: inputs.node-version != ''
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.pnpm-directory != '' && 'pnpm' || '' }}
          cache-dependency-path: ${{ inputs.pnpm-directory != '' && format('{0}/pnpm-lock.yaml', inputs.pnpm-directory) || '' }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # go-version-file wins when set; setup-go ignores go-version then.
          go-version: ${{ inputs.go-version-file == '' && inputs.go-version || '' }}
          go-version-file: ${{ inputs.go-version-file }}
          cache-dependency-path: ${{ inputs.working-directory }}/go.mod

      - name: Confirm a GoReleaser config is present
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        env:
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
        run: |
          set -euo pipefail
          if ! ls .goreleaser.y*ml >/dev/null 2>&1; then
            echo "No .goreleaser.yml found in ${WORKING_DIRECTORY}."
            echo "This workflow expects the consumer repository to own its GoReleaser config."
            exit 1
          fi

      - name: Set up QEMU
        if: inputs.docker
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: inputs.docker
        uses: docker/setup-buildx-action@v3

      - name: Log in to the container registry
        if: inputs.docker
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for a GPG key
        id: gpgcheck
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${GPG_PRIVATE_KEY:-}" ]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
            echo "No GPG_PRIVATE_KEY set; artifacts will not be signed." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Import GPG key
        id: gpg
        if: steps.gpgcheck.outputs.present == 'true'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --import
          echo "fingerprint=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/ {print $10; exit}')" >> "$GITHUB_OUTPUT"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: ${{ inputs.goreleaser-version }}
          args: ${{ inputs.goreleaser-args }}
          workdir: ${{ inputs.working-directory }}
        env:
          # GORELEASER_TOKEN when supplied: cross-repo pushes (tap, bucket) need
          # broader scope than the run's own GITHUB_TOKEN carries.
          GITHUB_TOKEN: ${{ secrets.GORELEASER_TOKEN || secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
          FURY_TOKEN: ${{ secrets.FURY_TOKEN }}
          AUR_KEY: ${{ secrets.AUR_KEY }}
          GPG_FINGERPRINT: ${{ steps.gpg.outputs.fingerprint }}
